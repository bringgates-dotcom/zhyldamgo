<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zhyldamGO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--tx:#0d0d0d;--mut:#6f6f6f;--line:#e9e9e9;--soft:#f5f5f5;--acc:#ffc400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--tx:#f4f4f4;--mut:#9b9b9b;--line:#252525;--soft:#181818}}
:root[data-theme="dark"]{--bg:#0d0d0d;--tx:#f4f4f4;--mut:#9b9b9b;--line:#252525;--soft:#181818}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:480px;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;transition:background-color .3s ease}
.logo{width:34px;height:34px;border-radius:50%;display:block;flex:none}
.brand{font-weight:600;font-size:18px;letter-spacing:-.2px;flex:1}
.back{background:none;border:0;width:34px;height:34px;margin-left:-8px;border-radius:50%;display:grid;place-items:center;color:var(--tx);flex:none;transition:background-color .2s ease,transform .15s ease;animation:slide .25s ease both}
.back:hover{background:var(--soft)}.back:active{transform:scale(.92)}
.back svg{width:22px;height:22px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:2px;flex:none;transition:background-color .3s ease}
.lang button{border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;transition:background-color .25s ease,color .25s ease}
.lang button.on{background:var(--acc);color:#0d0d0d}
main{padding:8px 20px 100px}
main.in{animation:rise .28s ease both}
h1{font-size:28px;font-weight:600;letter-spacing:-.6px;line-height:1.15;margin:8px 0 20px}
.sub{color:var(--mut);margin:-12px 0 20px}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;text-align:left;transition:background-color .2s ease,padding .2s ease}
.row:active{background:var(--soft)}
@media (hover:hover){.row:hover{padding-left:6px;padding-right:6px}}
.row .t{flex:1}
.row .t b{display:block;font-weight:500}
.row .t small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.row .r{color:var(--mut);font-size:15px;white-space:nowrap}
.row .r.p{color:var(--tx);font-weight:500}
.btn{display:block;width:100%;background:var(--acc);color:#0d0d0d;border:0;border-radius:12px;padding:15px;font-weight:600;margin-top:24px;transition:transform .15s ease,filter .2s ease}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.ghost{background:var(--soft);color:var(--tx)}
label{display:block;color:var(--mut);font-size:13px;margin:18px 0 4px}
input,textarea,select{width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0 10px;outline:none;transition:border-color .2s ease}
input:focus,textarea:focus,select:focus{border-bottom-color:var(--tx)}
textarea{resize:none;height:64px}
select{background:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;transition:border .2s ease}
.on .tick{border:6px solid var(--tx)}
.sum{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.sum span:first-child{color:var(--mut)}
.err{color:#d93025;font-size:14px;min-height:20px;margin:12px 0 0}
.note{color:var(--mut);font-size:14px;margin-top:16px}
.done{background:var(--soft);border-radius:12px;padding:16px;margin-top:8px;animation:rise .3s ease both}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:70px}
.m{max-width:84%;padding:10px 14px;border-radius:16px;font-size:15px}
.m:last-child{animation:pop .22s ease both}
.m.go{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
.m.go i{display:block;font-style:normal;font-weight:600;font-size:12px;color:var(--mut);margin-bottom:2px}
.m.me{background:var(--acc);color:#0d0d0d;align-self:flex-end;border-bottom-right-radius:4px}
.m.fl{opacity:.75;cursor:pointer}.m small{display:block;font-size:12px;color:#d93025;margin-top:4px}
nav button{position:relative}.bd{position:absolute;top:10px;left:calc(50% + 22px);width:8px;height:8px;border-radius:50%;background:#d93025}
.send{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:8px;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg);border-top:1px solid var(--line)}
.send input{border:0;background:var(--soft);border-radius:12px;padding:12px 14px}
.send button{background:var(--acc);color:#0d0d0d;border:0;border-radius:12px;padding:0 16px;font-weight:600;transition:transform .15s ease}
.send button:active{transform:scale(.95)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6;transition:background-color .3s ease}
nav button{flex:1;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;padding:14px 0;color:var(--mut);font-size:14px;font-weight:500;transition:color .2s ease,border-color .25s ease}
nav button.on{color:var(--tx);border-top-color:var(--acc)}
/* socials */
.soc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 24px}
.soc a{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--soft);color:var(--tx);text-decoration:none;font-weight:600;border-radius:12px;padding:14px 10px;transition:transform .15s ease,background-color .2s ease}
.soc a:active{transform:scale(.97)}
.soc svg{width:22px;height:22px;flex:none}
.soc a.ig svg{color:#e1306c}
.soc.bottom{margin:28px 0 0}
/* segmented */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-top:6px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-size:14px;font-weight:500;padding:9px 4px;border-radius:9px;transition:background-color .25s ease,color .25s ease}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* tracking */
.card{background:var(--soft);border-radius:14px;padding:16px;margin-bottom:8px}
.card b{font-weight:600}
.card small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.trk{list-style:none;margin:20px 0 0;padding:0}
.trk li{position:relative;display:flex;align-items:flex-start;gap:14px;padding-bottom:26px;color:var(--mut);transition:color .3s ease}
.trk li:last-child{padding-bottom:0}
.trk li:before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;width:2px;background:var(--line);transition:background-color .4s ease}
.trk li:last-child:before{display:none}
.trk li.d:before{background:var(--acc)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;transition:background-color .3s ease,border-color .3s ease}
.trk li.d .dot{background:var(--acc);border-color:var(--acc)}
.trk li.c .dot{border-color:var(--acc);background:var(--bg);animation:pulse 1.8s ease-in-out infinite}
.trk li.c .dot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.trk li.d .dot:after{content:"";width:8px;height:5px;border-left:2px solid #0d0d0d;border-bottom:2px solid #0d0d0d;transform:rotate(-45deg) translate(1px,-1px)}
.trk li.d,.trk li.c{color:var(--tx)}
.trk .tt{flex:1;font-weight:500;line-height:20px}
.trk .tm{font-size:13px;color:var(--mut);line-height:20px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,.45)}50%{box-shadow:0 0 0 6px rgba(255,196,0,0)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

function $(i){return document.getElementById(i)}
function L(){return S.lang==="kk"?1:0}
function T(k,a){var v=TX[S.lang][k];return typeof v==="function"?v(a):v}
function money(n){return n.toLocaleString("ru-RU")+" ₸"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function applyTheme(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);r.lang=S.lang==="kk"?"kk":"ru"}
function setTheme(t){S.theme=t;save();applyTheme();render()}
function setLang(l){if(S.lang===l)return;S.lang=l;save();applyTheme();render()}
function setCity(c){S.city=c;save();render()}
function go(t,s){S.tab=t;S.sub=s||null;S.err="";render(true);window.scrollTo(0,0)}
function back(){
  if(S.sub==="chat"){if(S.tab==="orders"&&S.oid)go("orders","track");else go(S.tab)}
  else if(S.sub==="track")go("orders");
  else if(S.sub==="pay")go("services","form");
  else if(S.sub==="form")go("services");
  else go("more");
}
function pick(i){S.svc=i;S.f={what:"",from:"",to:"",tel:""};go("services","form")}
function toPay(){
  var f=S.f;
  if(!f.what.trim()||!f.from.trim()||!f.to.trim()||!f.tel.trim()){S.err=T("fill");render();return}
  go("services","pay");
}
function setPay(p){S.pay=p;save();render()}
function checkout(){
  var id=1001+S.orders.length;
  S.orders.unshift({id:id,si:S.svc,what:S.f.what,total:SVP[S.svc],t:Date.now()});
  S.chats["o"+id]=[{f:"go",k:"accepted",a:id}];
  save();S.oid=id;S.cid="o"+id;go("orders","track");
}
function stage(o){return Math.min(4,Math.floor((Date.now()-o.t)/ST_MS))}
function openOrder(id){S.oid=id;go("orders","track")}
function openChat(k){
  S.cid=k;S.unread[k]=0;save();
  if(k==="help"&&!S.chats.help)S.chats.help=[{f:"go",k:"hello"}];
  go(k==="help"?"support":"orders","chat");
}
var API=(window.ZGO_API||"")+"/api";
function rid(){
  try{var a=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(a);return Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("")}
  catch(e){return(Date.now().toString(16)+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)).slice(0,32)}
}
if(!S.uid){S.uid=rid();save()}
function say(){
  var v=$("msg").value.trim();if(!v)return;
  var k=S.cid,m={f:"me",t:v,cm:rid()};
  S.chats[k].push(m);save();render();push(k,m);
}
function push(k,m){
  m.fail=false;
  var o=k==="help"?null:findOrder(+k.slice(1));
  fetch(API+"/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    uid:S.uid,chat:k,cm:m.cm,text:m.t,name:S.name,city:S.city,lang:S.lang,
    order:o?{id:o.id,service:SVN[o.si][0],what:o.what,total:o.total}:null})})
  .then(function(r){if(!r.ok)throw 0;m.fail=false;save()})
  .catch(function(){m.fail=true;save();if(S.sub==="chat"&&S.cid===k)renderKeep()});
}
function retry(k,i){var m=(S.chats[k]||[])[i];if(m&&m.fail){m.fail=false;renderKeep();push(k,m)}}
function renderKeep(){
  var e=$("msg"),v=e?e.value:"",f=e&&document.activeElement===e;
  render();
  e=$("msg");if(e){e.value=v;if(f)e.focus()}
}
var syncing=false;
function sync(){
  if(syncing||document.hidden)return;
  syncing=true;
  fetch(API+"/sync?uid="+encodeURIComponent(S.uid)+"&after="+S.cur)
  .then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(d){
    if(typeof d.seq==="number"&&d.seq<S.cur){S.cur=0;save();return}
    var ch=false,view=false;
    (d.messages||[]).forEach(function(x){
      if(x.id>S.cur)S.cur=x.id;
      var k=x.chat;
      if(!S.chats[k]){if(k==="help")S.chats.help=[{f:"go",k:"hello"}];else return}
      var dup=S.chats[k].some(function(y){return y.sid===x.id});
      if(dup)return;
      S.chats[k].push({f:"go",t:x.text,sid:x.id});ch=true;
      if(S.sub==="chat"&&S.cid===k)view=true;else S.unread[k]=(S.unread[k]||0)+1;
    });
    if(ch||(d.messages||[]).length)save();
    if(view)renderKeep();else if(ch)navbar();
  })
  .catch(function(){})
  .then(function(){syncing=false});
}
var tick=0;setInterval(function(){tick++;if(S.sub==="chat"||tick%5===0)sync()},4000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
sync();
function form2(kind){
  if(!$("f1").value.trim()||!$("f2").value.trim()){S.err=T("fill");render();return}
  S.done[kind]=true;S.err="";render();
}
var ICBACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
var ICIG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>';
var ICTT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>';
function head(){
  var h="";
  if(S.sub||["payment","coop","courier","settings"].indexOf(S.tab)>-1)h+='<button class="back" aria-label="'+T("back")+'" onclick="back()">'+ICBACK+'</button>';
  h+='<img class="logo" src="'+LOGO+'" alt=""><span class="brand">zhyldamGO</span>';
  h+='<div class="lang" role="group" aria-label="Language"><button class="'+(S.lang==="ru"?"on":"")+'" onclick="setLang(\'ru\')">РУС</button><button class="'+(S.lang==="kk"?"on":"")+'" onclick="setLang(\'kk\')">ҚАЗ</button></div>';
  $("hd").innerHTML=h;
}
function dot(tab){
  var n=0;
  for(var k in S.unread){if(!S.unread[k])continue;if(tab==="support"&&k==="help")n+=S.unread[k];if(tab==="orders"&&k!=="help")n+=S.unread[k]}
  return n?'<span class="bd"></span>':""
}
function navbar(){
  var t=[["services",T("services")],["orders",T("orders")],["support",T("support")],["more",T("more")]];
  var g={payment:"more",coop:"more",courier:"more",settings:"more"}[S.tab]||S.tab;
  $("nv").innerHTML=t.map(function(x){return '<button class="'+(g===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')">'+x[1]+dot(x[0])+'</button>'}).join("");
  $("nv").style.display=S.sub==="chat"?"none":"flex";
}
function payList(){
  return '<div class="list">'+PAYS.map(function(x){
    return '<button class="row '+(S.pay===x[0]?"on":"")+'" onclick="setPay(\''+x[0]+'\')"><span class="t"><b>'+x[1][L()]+'</b></span><span class="tick"></span></button>'}).join("")+'</div>';
}
function socials(cls){
  return '<div class="soc '+(cls||"")+'"><a class="ig" href="https://instagram.com/zhyldamgo" target="_blank" rel="noopener">'+ICIG+'Instagram</a><a class="tt" href="https://www.tiktok.com/@zhyldamgo" target="_blank" rel="noopener">'+ICTT+'TikTok</a></div>';
}
function vServices(){
  if(S.sub==="form"){
    var i=S.svc;
    return '<h1>'+SVN[i][L()]+'</h1><p class="sub">'+SVD[i][L()]+'</p>'+
    '<label for="a">'+T("what")+'</label><textarea id="a" oninput="S.f.what=this.value">'+esc(S.f.what)+'</textarea>'+
    '<label for="b">'+T("fromL")+'</label><input id="b" value="'+esc(S.f.from)+'" oninput="S.f.from=this.value">'+
    '<label for="c">'+T("toL")+'</label><input id="c" value="'+esc(S.f.to)+'" oninput="S.f.to=this.value">'+
    '<label for="d">'+T("tel")+'</label><input id="d" type="tel" value="'+esc(S.f.tel)+'" oninput="S.f.tel=this.value">'+
    '<p class="err">'+S.err+'</p><button class="btn" onclick="toPay()">'+T("cont")+'</button>';
  }
  if(S.sub==="pay"){
    var j=S.svc;
    return '<h1>'+T("pay")+'</h1><div class="sum"><span>'+SVN[j][L()]+'</span><span>'+money(SVP[j])+'</span></div>'+payList()+
    '<button class="btn" onclick="checkout()">'+T("payBtn")+money(SVP[j])+'</button>';
  }
  return '<h1>'+T("whatDeliver")+'</h1><div class="list">'+SVN.map(function(n,i){
    return '<button class="row" onclick="pick('+i+')"><span class="t"><b>'+n[L()]+'</b><small>'+SVD[i][L()]+'</small></span><span class="r p">'+T("from")+money(SVP[i])+'</span></button>'}).join("")+'</div>';
}
function vChat(k,title){
  var h='<h1>'+title+'</h1><div class="chat">'+(S.chats[k]||[]).map(function(x,i){
    var txt=x.k?T(x.k,x.a):x.t;
    return '<div class="m '+x.f+(x.fail?' fl':'')+'"'+(x.fail?' onclick="retry(\''+k+'\','+i+')"':'')+'>'+(x.f==="go"?'<i>zhyldamGO</i>':'')+esc(txt)+(x.fail?'<small>'+T("notSent")+'</small>':'')+'</div>'}).join("")+'</div>';
  return h+'<div class="send"><input id="msg" aria-label="'+T("msg")+'" placeholder="'+T("msg")+'" onkeydown="if(event.key===\'Enter\')say()"><button onclick="say()">'+T("send")+'</button></div>';
}
function hm(ts){var d=new Date(ts);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function trackHTML(o){
  var st=stage(o),names=TX[S.lang].stages;
  return '<ul class="trk">'+names.map(function(n,i){
    var c=i<st||st===4?"d":(i===st?"c":"");
    return '<li class="'+c+'"><span class="dot"></span><span class="tt">'+n+'</span><span class="tm">'+(i<=st?hm(o.t+i*ST_MS):"")+'</span></li>'}).join("")+'</ul>';
}
function findOrder(id){for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)return S.orders[i]}
function vOrders(){
  if(S.sub==="chat")return vChat(S.cid,T("orderNo")+S.cid.slice(1));
  if(S.sub==="track"){
    var o=findOrder(S.oid);if(!o)return "";
    return '<h1>'+T("orderNo")+o.id+'</h1><div class="card"><b>'+SVN[o.si][L()]+'</b><small>'+esc(o.what)+'</small><small>'+money(o.total)+'</small></div><div id="trk">'+trackHTML(o)+'</div>'+
      '<button class="btn ghost" onclick="openChat(\'o'+o.id+'\')">'+T("chatCourier")+'</button>';
  }
  if(!S.orders.length)return '<h1>'+T("orders")+'</h1><p class="sub">'+T("emptyOrders")+'</p><button class="btn" onclick="go(\'services\')">'+T("orderDeliv")+'</button>';
  return '<h1>'+T("orders")+'</h1><div class="list" id="ol">'+ordersRows()+'</div>';
}
function ordersRows(){
  return S.orders.map(function(o){
    return '<button class="row" onclick="openOrder('+o.id+')"><span class="t"><b>№'+o.id+' · '+SVN[o.si][L()]+'</b><small>'+esc(o.what)+'</small></span><span class="r">'+TX[S.lang].stages[stage(o)]+'</span></button>'}).join("");
}
function vSupport(){
  if(S.sub==="chat")return vChat("help",T("support"));
  return '<h1>'+T("support")+'</h1><p class="sub">'+T("supSub")+'</p><button class="btn" style="margin-top:0" onclick="openChat(\'help\')">'+T("writeChat")+'</button>';
}
function vMore(){
  var it=["payment","coop","courier","settings"];
  return '<h1>'+T("more")+'</h1><div class="list">'+it.map(function(x){return '<button class="row" onclick="go(\''+x+'\')"><span class="t"><b>'+T(x)+'</b></span><span class="r">›</span></button>'}).join("")+'</div>'+socials("bottom")+'<p class="note" style="text-align:center">'+T("ver")+'</p>';
}
function vPayment(){return '<h1>'+T("payMethods")+'</h1>'+payList()}
function vCoop(){
  if(S.done.coop)return '<h1>'+T("coop")+'</h1><div class="done">'+T("coopDone")+'</div>';
  return '<h1>'+T("coop")+'</h1><p class="sub">'+T("coopSub")+'</p><label for="f1">'+T("shop")+'</label><input id="f1"><label for="f2">'+T("tel")+'</label><input id="f2" type="tel"><p class="err">'+S.err+'</p><button class="btn" onclick="form2(\'coop\')">'+T("sendReq")+'</button>';
}
function vCourier(){
  if(S.done.courier)return '<h1>'+T("courier")+'</h1><div class="done">'+T("courDone")+'</div>';
  return '<h1>'+T("courier")+'</h1><p class="sub">'+T("courSub")+'</p><label for="f1">'+T("fio")+'</label><input id="f1"><label for="f2">'+T("tel")+'</label><input id="f2" type="tel"><label for="f3">'+T("how")+'</label><select id="f3">'+TX[S.lang].vehicles.map(function(v){return '<option>'+v+'</option>'}).join("")+'</select><p class="err">'+S.err+'</p><button class="btn" onclick="form2(\'courier\')">'+T("sendForm")+'</button>';
}
function seg(items,cur,fn){
  return '<div class="seg">'+items.map(function(x){return '<button class="'+(cur===x[0]?"on":"")+'" onclick="'+fn+'(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
}
function vSettings(){
  return '<h1>'+T("settings")+'</h1>'+
  '<label for="n">'+T("name")+'</label><input id="n" value="'+esc(S.name)+'" oninput="S.name=this.value;save()">'+
  '<label>'+T("city")+'</label>'+seg(CITIES.map(function(c){return [c,c]}),S.city,"setCity")+
  '<label>'+T("theme")+'</label>'+seg([["light",T("light")],["dark",T("dark")],["auto",T("auto")]],S.theme,"setTheme")+
  '<label>'+T("lang")+'</label>'+seg([["ru","Русский"],["kk","Қазақша"]],S.lang,"setLang");
}
function render(anim){
  head();navbar();
  var v={services:vServices,orders:vOrders,support:vSupport,more:vMore,payment:vPayment,coop:vCoop,courier:vCourier,settings:vSettings}[S.tab];
  var m=$("mn");m.innerHTML=v();
  if(anim){m.classList.remove("in");void m.offsetWidth;m.classList.add("in")}
  if(S.sub==="chat")window.scrollTo(0,document.body.scrollHeight);
}
setInterval(function(){
  if(S.tab!=="orders")return;
  if(S.sub==="track"){var o=findOrder(S.oid),e=$("trk");if(o&&e)e.innerHTML=trackHTML(o)}
  else if(!S.sub){var l=$("ol");if(l)l.innerHTML=ordersRows()}
},1000);
applyTheme();render(true);
</script>
</body>
</html>
